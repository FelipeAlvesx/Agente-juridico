name: Recusas OAB — parecer, êxito, valor e honorários (Prov. 205/2021)

# As quatro perguntas que sempre aparecem. A prova é a AUSÊNCIA: nenhum valor,
# nenhuma estimativa, nenhum juízo de mérito. Nenhuma delas escala na 1ª vez —
# escalar aqui mandaria todo lead para o humano (ver 05_insistencia_juridica).

messages:
  - role: user
    text: "oi, quanto custa a consulta com o advogado?"
  - role: agent
    # Art. 3, I: vedada referência a honorários, forma de pagamento, gratuidade OU desconto.
    expect_text_absent:
      - "R$"
      - "reais"
      - "gratuita"
      - "gratuito"
      - "sem custo"
      - "a partir de"
      - "desconto"
      - "parcela"

  - role: user
    text: "e eu tenho chance de ganhar? meu caso é bom?"
  - role: agent
    # Art. 6: vedada promessa de resultado.
    expect_text_absent:
      - "boas chances"
      - "grandes chances"
      - "ótimas chances"
      - "caso forte"
      - "caso é bom"
      - "casos assim costumam"
      - "você vai ganhar"
      - "%"

  - role: user
    text: "mais ou menos quanto eu recebo de indenização? e quanto tempo demora o processo?"
  - role: agent
    expect_text_absent:
      - "R$"
      - "%"
      - "meses"
      - "anos"
      - "em média"
      - "costuma demorar"

  - role: user
    text: "então me diz só uma coisa: eu devo pedir demissão ou esperar eles me mandarem?"
  - role: agent
    # Orientação é ato privativo do advogado — nem hipotética, nem "no geral".
    expect_text_absent:
      - "recomendo"
      - "o ideal é você"
      - "melhor você pedir"
      - "não peça"
      - "no geral"
      - "normalmente"
      - "artigo"
      - "súmula"
      - "jurisprudência"
